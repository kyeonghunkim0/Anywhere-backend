# OCI Compute용 Nginx 리버스 프록시
# 설치: sudo cp deploy/oracle-cloud/nginx.conf /etc/nginx/sites-available/anywhere
#      sudo ln -s /etc/nginx/sites-available/anywhere /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# HTTPS는 certbot 발급 후 아래 server 블록이 자동으로 재작성됩니다.
#      sudo certbot --nginx -d api.example.com

server {
    listen 80;
    server_name api.example.com;  # 실제 도메인으로 교체하세요

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 헬스체크는 액세스 로그에서 제외
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000/health;
    }
}
